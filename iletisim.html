<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Unit X</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('arka-plan.png') no-repeat center center fixed;
            background-size: cover; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .contact-card { 
            max-width: 450px; 
            width: 90%;
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(15px); 
            padding: 50px 30px; 
            border-radius: 20px; 
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 { 
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 2px;
            border-bottom: 2px solid #38bdf8;
            display: inline-block;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .email-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin: 20px 0;
        }

        .email-box span {
            display: block;
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .email-box a {
            color: #38bdf8;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            word-break: break-all; /* Uzun maillerin taşmaması için */
        }

        .email-box a:hover {
            color: #7dd3fc;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .back-btn { 
            display: inline-block; 
            margin-top: 30px; 
            color: #0f172a; 
            text-decoration: none; 
            font-weight: bold; 
            background: #38bdf8;
            padding: 12px 30px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #7dd3fc;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h1>İLETİŞİM</h1>
        <p style="color: #9ca3af; margin-bottom: 30px;">Sorularınız veya veri önerileriniz için e-posta yoluyla ulaşabilirsiniz.</p>
        
        <div class="email-box">
            <span>E-POSTA ADRESİ</span>
            <a href="mailto:3167rehber@gmail.com">3167rehber@gmail.com</a>
        </div>

        <a href="index.html" class="back-btn">← Ana Sayfaya Dön</a>
    </div>

</body>
</html>
